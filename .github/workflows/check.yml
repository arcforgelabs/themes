name: Theme check

# Runs scripts/check on every theme: required files, DESIGN.md lint,
# preset text contrast, the explainer token contract, contrast at
# Web Content Accessibility Guidelines level double A, and the diagram colour key.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full commit SHA. This org rejects a floating tag such as @v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Install the logo library
        run: npm ci

      - name: Check every theme against the contract
        run: python3 scripts/check
